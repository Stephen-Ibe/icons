name: Icons Build

on:
  workflow_run:
    workflows: ['Icons CI']
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout to Master Built branch
        env:
          USER_EMAIL: 'badasswpdev@gmail.com'
          USER_NAME: 'badasswp'
        run: |
          git config user.email "${USER_EMAIL}"
          git config user.name "${USER_NAME}"
          git checkout -B master-built

      - name: Clean Up Files
        run: |
          while IFS= read -r file; do
            [ -e "$file" ] && git rm -rf -- "$file"
          done < .deployignore
          git rm -f .deployignore

      - name: Push to Master Built
        run: |
          git commit -m "push to master-built" || echo "No changes to commit"
          git push origin master-built --force

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
